<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Realza tu mirada · Cejas, pestañas y cuidado en Andorra</title>
  <meta name="description" content="Estudio de mirada en Andorra. Laminado de cejas, lifting y extensiones de pestañas, sérum profesional y formación. Por Jonathan y Stephany." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@200;300;400;500;600&family=Allison&display=swap" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="variant-a.css" />
  <link rel="stylesheet" href="variant-b.css" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Static preloader -->
  <div id="boot-preloader" style="position:fixed;inset:0;background:#FAD6B4;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s ease">
    <svg viewBox="0 0 120 60" width="140" height="70" aria-hidden="true">
      <path d="M6 36 Q60 -4 114 36" fill="none" stroke="#2B1812" stroke-width="2" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="600">
        <animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.4s" fill="freeze" />
      </path>
      <path d="M10 38 Q60 56 110 38" fill="none" stroke="#2B1812" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="600">
        <animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.4s" begin="0.2s" fill="freeze" />
      </path>
      <circle cx="60" cy="36" r="6" fill="#2B1812" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze" />
      </circle>
    </svg>
    <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:2.5rem;letter-spacing:0.16em;font-weight:500;color:#2B1812">
      REALZA TU MIRADA
    </div>
    <div id="boot-bar" style="width:0;height:1px;background:#A35C32;transition:width .8s ease;margin-top:8px">
      <script>setTimeout(() => { const b = document.getElementById('boot-bar'); if (b) b.style.width = '220px'; }, 200);</script>
    </div>
    <div style="position:absolute;bottom:32px;font-family:Manrope,system-ui,sans-serif;font-size:0.7rem;letter-spacing:0.32em;text-transform:uppercase;color:rgba(43,24,18,0.6)">
      Estudio · Andorra
    </div>
  </div>
  <script>
    const __waitForReact = () => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const pl = document.getElementById('boot-preloader');
        if (pl) {
          pl.style.opacity = '0';
          setTimeout(() => pl.remove(), 600);
        }
      } else {
        requestAnimationFrame(__waitForReact);
      }
    };
    requestAnimationFrame(__waitForReact);
  </script>

  <script type="text/babel" data-presets="env,react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="shared.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="variant-a.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="variant-b-data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="variant-b-hero.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="variant-b-sections.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="variant-b-training.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="variant-b.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>
</html>
